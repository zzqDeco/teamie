openapi: 3.1.0
info:
  title: Teamie workspace message search
  version: 1.0.0
  description: Read-only Chat search projection across currently authorized conversations in a workspace. No Agent runtime resource appears in this contract.
security:
  - session: []
  - principal: []
paths:
  /api/v1/workspaces/{id}/messages/search:
    get:
      operationId: searchWorkspaceMessages
      description: Searches unretracted messages across channels and authorized direct/group conversations in the target workspace using literal, case-insensitive substring matching. Neither platform administration nor workspace ownership bypasses private conversation membership. Reading a page does not mark messages read.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: q
          in: query
          required: true
          description: Trimmed literal keyword (1 to 200 Unicode characters).
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: cursor
          in: query
          description: Opaque descending createdAt/id cursor from the previous page.
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Newest-first workspace message search page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  cursor: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      required: [message, conversation]
                      properties:
                        message: {$ref: './attachments.openapi.yaml#/components/schemas/Message'}
                        conversation:
                          type: object
                          required: [id, workspaceId, name, type]
                          properties:
                            id: {type: string}
                            workspaceId: {type: string}
                            name: {type: string}
                            type: {type: string, enum: [channel, direct, group]}
        '400':
          description: Invalid query, cursor or page size (code invalid_query).
        '401':
          description: Invalid or revoked identity/session.
        '404':
          description: Workspace unavailable or caller is not a current workspace member.
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: teamie_session
    principal:
      type: http
      scheme: bearer
      description: Generic participant bearer also requires X-Teamie-Service-Key; browser impersonation is forbidden.
