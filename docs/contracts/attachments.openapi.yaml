openapi: 3.1.0
info:
  title: Teamie IM conversation file routes
  version: 1.0.0
  description: Changed IM v1 routes. Current conversation ACLs apply to cookie and generic principal authentication. No public download URLs exist.
security:
  - session: []
  - principal: []
paths:
  /api/v1/conversations/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: uploadAttachment
      description: Upload exactly one file. New uploads require the enabled write flag; matching committed retries remain readable when disabled. Normal CSRF/Origin apply to browser writes. Unlinked uploads expire in 24 hours. An optional uploader-scoped Idempotency-Key binds the destination, filename and original bytes atomically, including after linkage. Removed or expired keys cannot be reused.
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: Idempotency-Key
          in: header
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Non-empty file, maximum 4194304 binary bytes. Filename is validated; MIME is server-sniffed.
      responses:
        '200':
          $ref: '#/components/responses/Attachment'
        '201':
          description: Private pending file descriptor
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment:
                    $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          description: upload_conflict - the key already identifies different bytes, filename or destination
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          $ref: '#/components/responses/Failure'
        '413':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
  /api/v1/conversations/{id}/attachment-uploads/{uploadKey}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: uploadKey
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    get:
      operationId: lookupOwnAttachmentUpload
      description: Recover only the current uploader's descriptor under current conversation ACLs, including linked uploads and disabled write flags. Returns no bytes, upload key, uploader or runtime details. An authorized unknown key returns attachment_upload_not_found; denied membership uses the normal not_found response. Removed, expired or retracted uploads return attachment_upload_unavailable and never create another file.
      responses:
        '200':
          $ref: '#/components/responses/Attachment'
        '400':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '410':
          $ref: '#/components/responses/Failure'
  /api/v1/conversations/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AttachmentId'
    delete:
      operationId: deletePendingAttachment
      description: Remove the current uploader's unlinked file. A missing file is idempotent; linked or someone else's file is unavailable. Current ACL and CSRF apply, even when upload writes are disabled.
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Pending file removed or already absent
        '404':
          $ref: '#/components/responses/Failure'
  /api/v1/conversations/{id}/attachments/{attachmentId}/content:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: downloadAttachment
      description: Current conversation members may read linked, unretracted files; only the uploader may read unexpired unlinked files. Upload flag does not restrict persisted reads.
      responses:
        '200':
          description: Original bytes, with no-store, nosniff, sandbox CSP and forced attachment disposition
          headers:
            Content-Disposition:
              schema: {type: string}
            X-Attachment-SHA256:
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
  /api/v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: searchConversationHistory
      description: Current conversation ACLs apply to humans and generic participants. Default q searches literal case-insensitive body text; content=files restricts results to delivered, unretracted attachment messages and matches filenames instead. Empty q in file mode browses delivered files. Results contain complete ordered attachment groups and never binary bytes or pending uploads. Disabled upload writes preserve existing reads. Pagination and filtering run in Chat before the page limit.
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
        - name: content
          in: query
          description: Omit for ordinary message history. File mode cannot combine with aroundSeq.
          schema: {type: string, enum: [files]}
        - name: beforeSeq
          in: query
          schema: {type: integer, minimum: 0}
        - name: aroundSeq
          in: query
          description: Ordinary message context only; cannot combine with beforeSeq or content=files.
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Ascending message sequence page, including ordinary source and attachment descriptors
          content:
            application/json:
              schema:
                type: object
                required: [messages, hasMore]
                properties:
                  messages:
                    type: array
                    items: {$ref: '#/components/schemas/Message'}
                  hasMore: {type: boolean}
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
    post:
      operationId: sendMessage
      description: Atomic attachment binding and message commit. Files must be the sender's unexpired unlinked uploads in this conversation. A stable clientMessageId compares original body, destination, reply and ordered attachment IDs. File-only messages are allowed.
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientMessageId, body]
              properties:
                clientMessageId: {type: string, minLength: 1, maxLength: 128}
                body: {type: string, maxLength: 8000}
                replyToId: {type: string}
                attachmentIds:
                  type: array
                  maxItems: 8
                  uniqueItems: true
                  items: {type: string}
                mentions:
                  type: array
                  maxItems: 32
                  description: Ordered nonoverlapping UTF-16 ranges binding @label text to current conversation members. Labels do not grant permissions.
                  items: {$ref: '#/components/schemas/Mention'}
      responses:
        '201':
          $ref: '#/components/responses/Message'
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: teamie_session
    principal:
      type: http
      scheme: bearer
      description: Internal generic participant bearer, also requires X-Teamie-Service-Key and forbids browser contexts.
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema: {type: string}
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: {type: string}
    CSRF:
      name: X-CSRF-Token
      in: header
      description: Required for cookie-authenticated writes; trusted Origin is checked separately.
      schema: {type: string}
  schemas:
    Mention:
      type: object
      additionalProperties: false
      required: [userId, start, end]
      properties:
        userId: {type: string, minLength: 1, maxLength: 128}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 1}
    Attachment:
      type: object
      additionalProperties: false
      required: [id, filename, mediaType, sizeBytes, sha256]
      properties:
        id: {type: string}
        filename: {type: string, minLength: 1, maxLength: 180}
        mediaType: {type: string}
        sizeBytes: {type: integer, minimum: 1, maximum: 4194304}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    Message:
      type: object
      required: [id, conversationId, senderId, clientMessageId, seq, body, createdAt]
      properties:
        id: {type: string}
        conversationId: {type: string}
        senderId: {type: string}
        senderName: {type: string}
        senderKind: {type: string, enum: [human, agent]}
        clientMessageId: {type: string}
        seq: {type: integer}
        body: {type: string}
        replyToId: {type: string}
        mentions:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/Mention'}
        attachments:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/Attachment'}
        createdAt: {type: string, format: date-time}
        editedAt: {type: string, format: date-time}
        retractedAt: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    Attachment:
      description: Current uploader's committed file descriptor
      content:
        application/json:
          schema:
            type: object
            required: [attachment]
            properties:
              attachment: {$ref: '#/components/schemas/Attachment'}
    Failure:
      description: Defined authentication, ACL, validation, conflict or capacity error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Message:
      description: Persisted message, or the same current message on retry
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: {$ref: '#/components/schemas/Message'}
