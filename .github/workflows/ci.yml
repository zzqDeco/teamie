name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: teamie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d teamie_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: |
            pkg/go.sum
            contracts/gen/im/go.sum
            services/identity/go.sum
            services/chat/go.sum
            services/realtime/go.sum
      - name: Test authorization, persistence and concurrency
        env:
          DATABASE_URL_TEST: postgres://postgres:ci-only-postgres@127.0.0.1:5432/teamie_test?sslmode=disable
        run: |
          for module in pkg contracts/gen/im services/identity services/chat services/realtime; do
            (cd "$module" && go test -race ./... && go vet ./... && go build ./...)
          done
      - name: Full HTTP and WebSocket acceptance against disposable processes
        run: bash ops/ci-acceptance.sh

  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: teamie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d teamie_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: |
            pkg/go.sum
            contracts/gen/im/go.sum
            contracts/gen/agent/go.sum
            services/agent-control/go.sum
            services/agent-runtime/go.sum
            services/llm-gateway/go.sum
            services/sandbox/go.sum
      - name: Build immutable disposable execution runner
        run: |
          docker build --tag teamie-sandbox-runner-ci --file services/sandbox/runner/Dockerfile .
          printf 'SANDBOX_TEST_RUNNER_IMAGE=%s\n' "$(docker image inspect teamie-sandbox-runner-ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Create isolated runtime integration database
        run: docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres runtime_test
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: Race tests and checks across independently rooted Go modules
        env:
          TEAMIE_RUNTIME_TEST_DATABASE_URL: postgres://postgres:ci-only-postgres@127.0.0.1:5432/runtime_test?sslmode=disable
          DATABASE_URL_TEST: postgres://postgres:ci-only-postgres@127.0.0.1:5432/teamie_test?sslmode=disable
        run: |
          for module in contracts/gen/agent services/agent-control services/agent-runtime services/llm-gateway services/sandbox; do
            (cd "$module" && go test -race -timeout 300s ./... && go vet ./... && go build ./...)
          done
      - name: Verify operator isolation evidence with the real Sandbox runner
        run: |
          (cd services/sandbox && go build -o "$RUNNER_TEMP/sandboxctl" ./cmd/sandboxctl)
          probe_root=$(sudo mktemp -d)
          trap 'sudo rm -rf "$probe_root"' EXIT
          sudo setpriv --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env SANDBOX_WORKSPACE_ROOT="$probe_root" SANDBOX_RUNNER_IMAGE="$SANDBOX_TEST_RUNNER_IMAGE" \
            "$RUNNER_TEMP/sandboxctl" isolation --nonce "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Agent profile privacy and IM acceptance against fresh disposable processes
        run: bash ops/ci-agent-acceptance.sh
      - name: Restore every service database into a disposable target and verify data
        run: bash ops/ci-restore.sh
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {service: identity, dockerfile: services/identity/Dockerfile}
          - {service: chat, dockerfile: services/chat/Dockerfile}
          - {service: realtime, dockerfile: services/realtime/Dockerfile}
          - {service: web, dockerfile: apps/web/Dockerfile}
          - {service: agent-control, dockerfile: services/agent-control/Dockerfile}
          - {service: agent-runtime, dockerfile: services/agent-runtime/Dockerfile}
          - {service: llm-gateway, dockerfile: services/llm-gateway/Dockerfile}
          - {service: sandbox, dockerfile: services/sandbox/Dockerfile}
          - {service: sandbox-runner, dockerfile: services/sandbox/runner/Dockerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production Linux images before cutting a release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=ci
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkg/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned RPC code generators
        run: |
          go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.16.4
          go install github.com/cloudwego/thriftgo@v0.4.5
      - name: Enforce contract sync, IM independence and Clean DDD dependency boundaries
        run: |
          make gen && git diff --exit-code -- contracts/ packages/api-client/src/generated.ts
          bash ops/check-architecture.sh
      - run: python3 -m unittest discover -s ops -p 'test_*.py' -v
      - name: Validate shell and workflow syntax
        run: |
          for file in ops/*.sh deploy/postgres/*.sh; do bash -n "$file"; done
          shellcheck -x ops/*.sh deploy/postgres/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - run: bash ops/check-compose.sh
      - name: Validate explicit public-IP ACME configuration
        run: |
          docker run --rm --network none --env SITE_ADDRESS=https://192.0.2.1 --env TLS_SERVER_NAME=192.0.2.1 \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --volume "$PWD/deploy/tls/acme-ip.caddy:/etc/caddy/issuer.caddy:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify trusted IP HTTPS without SNI across a different local address
        run: |
          scratch=$(mktemp -d)
          container=$(docker create caddy:2.11.7-alpine)
          trap 'docker rm "$container" >/dev/null 2>&1 || true; rm -rf "$scratch"' EXIT
          docker cp "$container:/usr/bin/caddy" "$scratch/caddy"
          python3 ops/check-ip-tls.py --caddy "$scratch/caddy"
