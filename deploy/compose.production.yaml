name: teamie

x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  networks: [private]
  pids_limit: 128
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  caddy:
    image: ${CADDY_IMAGE:?manifest image required}
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?HTTPS site address required}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:?public hostname required for clients without SNI}
      GOMEMLIMIT: 48MiB
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_CONFIG_FILE:-/srv/teamie/tls/issuer.caddy}:/etc/caddy/issuer.caddy:ro
      - ${TLS_CERT_DIR:-/srv/teamie/tls/certs}:/run/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp:size=8m,mode=1777"]
    networks: [edge, private]
    logging: *logging
    depends_on:
      identity: {condition: service_healthy}
      chat: {condition: service_healthy}
      realtime: {condition: service_healthy}
      web: {condition: service_healthy}
      agent-control: {condition: service_healthy}
      llm-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?manifest image required}
    restart: unless-stopped
    read_only: true
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    networks: [private]
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 3s
      retries: 6

  identity:
    <<: *app
    image: ${IDENTITY_IMAGE:?manifest image required}
    mem_limit: 96m
    memswap_limit: 96m
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PPROF_ADDR: ${PPROF_ADDR:-127.0.0.1:6060}
      HTTP_ADDR: :8081
      RPC_ADDR: :8881
      DATABASE_URL: ${IDENTITY_DATABASE_URL:?identity database required}
      REDIS_ADDR: redis:6379
      APP_ORIGIN: ${APP_ORIGIN:?HTTPS origin required}
      COOKIE_SECURE: "true"
      IM_PRINCIPAL_CONTROL_TOKEN: ${IM_PRINCIPAL_CONTROL_TOKEN:?principal control credential required}
      IM_PRINCIPAL_RUNTIME_TOKEN: ${IM_PRINCIPAL_RUNTIME_TOKEN:?principal runtime credential required}
      BOOTSTRAP_INVITE_CODE: ${BOOTSTRAP_INVITE_CODE:-teamie-bootstrap}
      FEATURE_FLAGS_FILE: /etc/teamie/feature-flags.json
      GOMEMLIMIT: 72MiB
      GOMAXPROCS: "1"
    volumes:
      - ${FEATURE_FLAGS_PATH:-/srv/teamie/config/feature-flags.json}:/etc/teamie/feature-flags.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/readyz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  chat:
    <<: *app
    image: ${CHAT_IMAGE:?manifest image required}
    mem_limit: 192m
    memswap_limit: 192m
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PPROF_ADDR: ${PPROF_ADDR:-127.0.0.1:6060}
      HTTP_ADDR: :8082
      RPC_ADDR: :8882
      IDENTITY_RPC_ADDR: identity:8881
      IM_PRINCIPAL_CONTROL_TOKEN: ${IM_PRINCIPAL_CONTROL_TOKEN:?principal control credential required}
      DATABASE_URL: ${CHAT_DATABASE_URL:?chat database required}
      REDIS_ADDR: redis:6379
      APP_ORIGIN: ${APP_ORIGIN:?HTTPS origin required}
      COOKIE_SECURE: "true"
      FEATURE_FLAGS_FILE: /etc/teamie/feature-flags.json
      GOMEMLIMIT: 144MiB
      GOMAXPROCS: "1"
    volumes:
      - ${FEATURE_FLAGS_PATH:-/srv/teamie/config/feature-flags.json}:/etc/teamie/feature-flags.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      identity: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8082/readyz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  realtime:
    <<: *app
    image: ${REALTIME_IMAGE:?manifest image required}
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PPROF_ADDR: ${PPROF_ADDR:-127.0.0.1:6060}
      HTTP_ADDR: :8083
      IDENTITY_RPC_ADDR: identity:8881
      CHAT_RPC_ADDR: chat:8882
      REDIS_ADDR: redis:6379
      APP_ORIGIN: ${APP_ORIGIN:?HTTPS origin required}
      COOKIE_SECURE: "true"
      FEATURE_FLAGS_FILE: /etc/teamie/feature-flags.json
      GOMEMLIMIT: 96MiB
      GOMAXPROCS: "1"
    volumes:
      - ${FEATURE_FLAGS_PATH:-/srv/teamie/config/feature-flags.json}:/etc/teamie/feature-flags.json:ro
    depends_on:
      identity: {condition: service_healthy}
      chat: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8083/readyz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  agent-control:
    <<: *app
    image: ${AGENT_CONTROL_IMAGE:?manifest image required}
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PPROF_ADDR: ${PPROF_ADDR:-127.0.0.1:6060}
      HTTP_ADDR: :8084
      RPC_ADDR: :8884
      DATABASE_URL: ${AGENT_CONTROL_DATABASE_URL:?agent control database required}
      IDENTITY_RPC_ADDR: identity:8881
      CHAT_RPC_ADDR: chat:8882
      APP_ORIGIN: ${APP_ORIGIN:?HTTPS origin required}
      COOKIE_SECURE: "true"
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:?runtime control credential required}
      IM_PRINCIPAL_CONTROL_TOKEN: ${IM_PRINCIPAL_CONTROL_TOKEN:?principal control credential required}
      FEATURE_FLAGS_FILE: /etc/teamie/feature-flags.json
      GOMEMLIMIT: 40MiB
      GOMAXPROCS: "1"
    volumes:
      - ${FEATURE_FLAGS_PATH:-/srv/teamie/config/feature-flags.json}:/etc/teamie/feature-flags.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      identity: {condition: service_healthy}
      chat: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8084/readyz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  agent-runtime:
    <<: *app
    image: ${AGENT_RUNTIME_IMAGE:?manifest image required}
    mem_limit: 256m
    memswap_limit: 256m
    networks: [private, egress]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PPROF_ADDR: ${PPROF_ADDR:-127.0.0.1:6060}
      HTTP_ADDR: :8085
      RPC_ADDR: :8885
      DATABASE_URL: ${AGENT_RUNTIME_DATABASE_URL:?agent runtime database required}
      AGENT_CONTROL_RPC_ADDR: agent-control:8884
      IDENTITY_RPC_ADDR: identity:8881
      CHAT_RPC_ADDR: chat:8882
      IM_API_URL: http://chat:8082
      IM_REALTIME_URL: http://realtime:8083
      APP_ORIGIN: ${APP_ORIGIN:?HTTPS origin required}
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:?runtime control credential required}
      IM_PRINCIPAL_RUNTIME_TOKEN: ${IM_PRINCIPAL_RUNTIME_TOKEN:?principal runtime credential required}
      GATEWAY_RPC_ADDR: llm-gateway:8886
      GATEWAY_STREAM_URL: http://llm-gateway:8086/internal/v1/chat/stream
      GATEWAY_RUNTIME_TOKEN: ${GATEWAY_RUNTIME_TOKEN:?gateway runtime credential required}
      SANDBOX_RPC_ADDR: sandbox:8887
      SANDBOX_RUNTIME_TOKEN: ${SANDBOX_RUNTIME_TOKEN:?sandbox runtime credential required}
      FEATURE_FLAGS_FILE: /etc/teamie/feature-flags.json
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: "1"
    volumes:
      - ${FEATURE_FLAGS_PATH:-/srv/teamie/config/feature-flags.json}:/etc/teamie/feature-flags.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      agent-control: {condition: service_healthy}
      llm-gateway: {condition: service_healthy}
      sandbox: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8085/readyz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  llm-gateway:
    <<: *app
    image: ${LLM_GATEWAY_IMAGE:?manifest image required}
    mem_limit: 128m
    memswap_limit: 128m
    networks: [private, egress]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PPROF_ADDR: ${PPROF_ADDR:-127.0.0.1:6060}
      HTTP_ADDR: :8086
      RPC_ADDR: :8886
      DATABASE_URL: ${GATEWAY_DATABASE_URL:?gateway database required}
      IDENTITY_RPC_ADDR: identity:8881
      APP_ORIGIN: ${APP_ORIGIN:?HTTPS origin required}
      COOKIE_SECURE: "true"
      GATEWAY_MAX_CONCURRENT_CALLS: ${GATEWAY_MAX_CONCURRENT_CALLS:-16}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:?64 hex master key required}
      GATEWAY_RUNTIME_TOKEN: ${GATEWAY_RUNTIME_TOKEN:?gateway runtime credential required}
      GOMEMLIMIT: 96MiB
      GOMAXPROCS: "1"
    depends_on:
      postgres: {condition: service_healthy}
      identity: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8086/readyz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  sandbox:
    <<: *app
    image: ${SANDBOX_IMAGE:?manifest image required}
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PPROF_ADDR: ${PPROF_ADDR:-127.0.0.1:6060}
      HTTP_ADDR: :8087
      RPC_ADDR: :8887
      SANDBOX_RUNTIME_TOKEN: ${SANDBOX_RUNTIME_TOKEN:?sandbox runtime credential required}
      SANDBOX_RUNNER_IMAGE: ${SANDBOX_RUNNER_IMAGE:?immutable runner image required}
      SANDBOX_WORKSPACE_ROOT: /srv/teamie/sandbox-workspaces
      SANDBOX_STATE_ROOT: /srv/teamie/sandbox-state
      DOCKER_SOCKET: /var/run/docker.sock
      GOMEMLIMIT: 40MiB
      GOMAXPROCS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/teamie/sandbox-workspaces:/srv/teamie/sandbox-workspaces
      - /srv/teamie/sandbox-state:/srv/teamie/sandbox-state
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8087/readyz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  postgres:
    image: ${POSTGRES_IMAGE:?manifest image required}
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    shm_size: 64m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?database admin password required}
      POSTGRES_IDENTITY_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD:?identity password required}
      POSTGRES_CHAT_PASSWORD: ${POSTGRES_CHAT_PASSWORD:?chat password required}
      POSTGRES_AGENT_CONTROL_PASSWORD: ${POSTGRES_AGENT_CONTROL_PASSWORD:?agent control password required}
      POSTGRES_AGENT_RUNTIME_PASSWORD: ${POSTGRES_AGENT_RUNTIME_PASSWORD:?agent runtime password required}
      POSTGRES_GATEWAY_PASSWORD: ${POSTGRES_GATEWAY_PASSWORD:?gateway password required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=64MB, -c, work_mem=2MB, -c, maintenance_work_mem=32MB, -c, max_connections=40]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    networks: [private]
    logging: *logging
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:?manifest image required}
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: redis
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 40mb, --maxmemory-policy, allkeys-lru]
    tmpfs: ["/data:size=1m,mode=1777"]
    networks: [private]
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  edge: {}
  egress: {}
  private: {internal: true}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
